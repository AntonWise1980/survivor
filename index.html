<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survivor Arena - Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', system-ui; }
        .arena-card { transition: all 0.3s; }
        .arena-card:hover { transform: scale(1.02); }
        .win-flash { animation: flash 0.5s; }
        @keyframes flash { 0% { background: #22c55e; } 100% { background: transparent; } }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #18181b; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
        .extra-content { transition: max-height 0.5s ease-out; overflow: hidden; }
        
        /* Akordeon için özel geçiş */
        .archive-content { transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1); overflow: hidden; }
        .archive-item.active .chevron { transform: rotate(180deg); }
        .archive-item.active .archive-header { background: #27272a; border-color: #3f3f46; }
    </style>
</head>
<body class="bg-zinc-900 text-white min-h-screen">
    <div class="max-w-[1600px] mx-auto p-4 lg:p-8">
        <div class="flex flex-col md:flex-row justify-between items-center gap-4 mb-8">
            <div class="flex items-center gap-3">
                <i class="fas fa-fire text-4xl text-orange-500"></i>
                <h1 class="text-4xl font-bold tracking-tighter">SURVIVOR ARENA</h1>
            </div>
            <div class="flex gap-4">
                <button onclick="addPlayerModal()" class="bg-emerald-600 hover:bg-emerald-700 px-6 py-3 rounded-xl flex items-center gap-2 transition-colors">
                    <i class="fas fa-user-plus"></i> Oyuncu Ekle
                </button>
                <button onclick="resetAll()" class="bg-zinc-700 hover:bg-zinc-800 px-6 py-3 rounded-xl flex items-center gap-2 transition-colors">
                    <i class="fas fa-sync-alt"></i> Sıfırla
                </button>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-12 gap-6 items-start">
            
            <div class="md:col-span-2 lg:col-span-3 order-4 lg:order-1 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-1 gap-6">
                <div class="bg-zinc-800 rounded-3xl p-6 border border-zinc-700/50 text-center">
                    <div class="flex items-center justify-center gap-2 mb-6">
                        <div class="w-8 h-8 bg-red-500 rounded-full shadow-[0_0_15px_rgba(239,68,68,0.4)]"></div>
                        <h2 class="text-2xl font-bold text-red-400 italic tracking-tighter uppercase">Kırmızı</h2>
                    </div>
                    <div id="red-players-top" class="space-y-2"></div>
                    <div id="red-extra" class="extra-content max-h-0 space-y-2 mt-2"></div>
                    <button id="btn-red" onclick="toggleSection('red')" class="hidden w-full mt-3 py-2 bg-zinc-700/30 rounded-xl text-[10px] font-bold text-zinc-400 hover:text-white transition-all uppercase">DAHA FAZLA</button>
                </div>

                <div class="bg-zinc-800 rounded-3xl p-6 border border-zinc-700/50 text-center">
                    <div class="flex items-center justify-center gap-2 mb-6">
                        <div class="w-8 h-8 bg-blue-500 rounded-full shadow-[0_0_15px_rgba(59,130,246,0.4)]"></div>
                        <h2 class="text-2xl font-bold text-blue-400 italic tracking-tighter uppercase">Mavi</h2>
                    </div>
                    <div id="blue-players-top" class="space-y-2"></div>
                    <div id="blue-extra" class="extra-content max-h-0 space-y-2 mt-2"></div>
                    <button id="btn-blue" onclick="toggleSection('blue')" class="hidden w-full mt-3 py-2 bg-zinc-700/30 rounded-xl text-[10px] font-bold text-zinc-400 hover:text-white transition-all uppercase">DAHA FAZLA</button>
                </div>
            </div>

            <div class="md:col-span-2 lg:col-span-6 order-1 lg:order-2 space-y-6">
                <div class="bg-zinc-800 rounded-3xl p-6 border border-zinc-700/50 flex flex-col min-h-[500px]">
                    <button id="btn-new-game" onclick="startNewGameModal()" class="bg-gradient-to-r from-orange-500 to-red-500 hover:from-orange-600 hover:to-red-600 text-xl font-bold py-5 rounded-2xl mb-8 flex items-center justify-center gap-3 shadow-lg transform active:scale-95 transition-all">
                        <i class="fas fa-play"></i> YENİ OYUN BAŞLAT
                    </button>

                    <div id="active-game" class="hidden bg-zinc-900 border-2 border-orange-500/50 rounded-2xl p-6 mb-8 relative">
                        <div class="absolute -top-3 left-1/2 -translate-x-1/2 bg-orange-500 text-[10px] px-3 py-1 rounded-full font-black uppercase">Canlı Maç</div>
                        <div class="grid grid-cols-2 gap-6 items-center mt-2">
                            <div id="red-fighter" class="text-center p-4 bg-red-500/10 rounded-xl border border-red-500/20"></div>
                            <div id="blue-fighter" class="text-center p-4 bg-blue-500/10 rounded-xl border border-blue-500/20"></div>
                        </div>
                        <div class="flex flex-col gap-3 mt-8">
                            <div class="flex gap-4">
                                <button onclick="selectWinner('red')" class="flex-1 bg-red-600 hover:bg-red-700 py-4 rounded-2xl text-lg font-bold shadow-lg italic">KIRMIZI KAZANDI</button>
                                <button onclick="selectWinner('blue')" class="flex-1 bg-blue-600 hover:bg-blue-700 py-4 rounded-2xl text-lg font-bold shadow-lg italic">MAVİ KAZANDI</button>
                            </div>
                            <button onclick="cancelActiveGame()" class="text-zinc-500 hover:text-white text-xs font-bold uppercase py-2">Maçı İptal Et</button>
                        </div>
                    </div>

                    <div class="flex-1">
                        <h3 class="text-lg font-semibold mb-4 flex items-center gap-2">
                            <i class="fas fa-history text-zinc-400"></i> MAÇ GEÇMİŞİ
                        </h3>
                        <div id="game-archive" class="space-y-3"></div>
                    </div>
                </div>
            </div>

            <div class="md:col-span-2 lg:col-span-3 order-2 lg:order-3 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-1 gap-6">
                <div class="bg-zinc-800 rounded-3xl p-6 border border-zinc-700/50 h-fit">
                    <h2 class="text-xl font-bold mb-4 flex items-center gap-2 text-emerald-400">
                        <i class="fas fa-calendar-day"></i> GÜNLÜK TABLO
                    </h2>
                    <div class="flex text-[10px] font-black text-zinc-500 uppercase px-4 mb-2">
                        <div class="flex-1">OYUNCU</div>
                        <div class="w-7 text-center">M</div><div class="w-7 text-center">G</div><div class="w-7 text-center">M</div>
                    </div>
                    <div id="daily-scoreboard-top" class="space-y-2"></div>
                    <div id="daily-extra" class="extra-content max-h-0 space-y-2 mt-0"></div>
                    <button id="btn-daily" onclick="toggleSection('daily')" class="hidden w-full mt-3 py-2 bg-zinc-700/30 rounded-xl text-[10px] font-bold text-zinc-400 hover:text-white transition-all">DAHA FAZLA</button>
                </div>

                <div class="bg-zinc-800 rounded-3xl p-6 border border-zinc-700/50 h-fit">
                    <h2 class="text-xl font-bold mb-4 flex items-center gap-2 text-yellow-500">
                        <i class="fas fa-trophy"></i> GENEL TABLO
                    </h2>
                    <div class="flex text-[10px] font-black text-zinc-500 uppercase px-4 mb-2">
                        <div class="flex-1">OYUNCU</div>
                        <div class="w-7 text-center">M</div><div class="w-7 text-center">G</div><div class="w-7 text-center">M</div>
                    </div>
                    <div id="general-scoreboard-top" class="space-y-2"></div>
                    <div id="general-extra" class="extra-content max-h-0 space-y-2 mt-0"></div>
                    <button id="btn-general" onclick="toggleSection('general')" class="hidden w-full mt-3 py-2 bg-zinc-700/30 rounded-xl text-[10px] font-bold text-zinc-400 hover:text-white transition-all">DAHA FAZLA</button>
                </div>
            </div>
        </div>
    </div>

    <div id="add-player-modal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center z-50 p-4">
        <div class="bg-zinc-900 border border-zinc-700 rounded-3xl p-8 w-full max-w-md text-white">
            <h3 id="modal-title" class="text-2xl font-bold mb-6 italic uppercase">YENİ OYUNCU EKLE</h3>
            <input id="player-name" type="text" placeholder="İsim Soyisim" class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-6 py-4 text-lg mb-4 outline-none focus:ring-2 focus:ring-emerald-500">
            <div id="modal-buttons" class="flex gap-4">
                <button onclick="addPlayer('red')" class="flex-1 bg-red-600 py-4 rounded-2xl font-bold italic">KIRMIZIYA EKLE</button>
                <button onclick="addPlayer('blue')" class="flex-1 bg-blue-600 py-4 rounded-2xl font-bold italic">MAVİYE EKLE</button>
            </div>
            <button onclick="closeModal()" class="mt-6 w-full text-zinc-500">Vazgeç</button>
        </div>
    </div>

    <div id="new-game-modal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center z-50 p-4 text-white">
        <div class="bg-zinc-900 border border-zinc-700 rounded-3xl p-8 w-full max-w-lg">
            <h3 class="text-2xl font-bold mb-6 italic text-orange-500 text-center uppercase">Oyuncu Seçimi</h3>
            <div class="space-y-4">
                <div class="text-red-400 font-bold">KIRMIZI TAKIM: 
                    <select id="red-select" class="w-full bg-zinc-800 p-4 rounded-xl mt-2 outline-none border border-zinc-700"></select>
                </div>
                <div class="text-center font-black text-zinc-600">VS</div>
                <div class="text-blue-400 font-bold">MAVİ TAKIM: 
                    <select id="blue-select" class="w-full bg-zinc-800 p-4 rounded-xl mt-2 outline-none border border-zinc-700"></select>
                </div>
            </div>
            <div class="flex gap-4 mt-8">
                <button onclick="startGameFromModal()" class="flex-1 bg-orange-600 py-4 rounded-2xl font-bold italic text-lg shadow-lg">MÜSABAKAYI BAŞLAT</button>
                <button onclick="closeNewGameModal()" class="flex-1 bg-zinc-700 py-4 rounded-2xl font-bold">İptal</button>
            </div>
        </div>
    </div>

    <div id="edit-game-modal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center z-50 p-4 text-white">
        <div class="bg-zinc-900 border border-zinc-700 rounded-3xl p-8 w-full max-w-md">
            <h3 class="text-xl font-bold mb-6 text-center uppercase italic">Sonucu Düzelt</h3>
            <div id="edit-info" class="text-center mb-6 text-zinc-400 text-sm"></div>
            <div class="flex gap-4">
                <button id="edit-win-red" class="flex-1 bg-red-600 py-4 rounded-2xl font-bold italic">KIRMIZI</button>
                <button id="edit-win-blue" class="flex-1 bg-blue-600 py-4 rounded-2xl font-bold italic">MAVİ</button>
            </div>
            <button onclick="document.getElementById('edit-game-modal').classList.add('hidden')" class="mt-6 w-full text-zinc-500">Vazgeç</button>
        </div>
    </div>

    <script>
        const PLAYERS_KEY = 'survivor_players';
        const GAMES_KEY = 'survivor_games';
        let players = []; let games = []; let currentGame = null;
        let expanded = { daily: false, general: false, red: false, blue: false };
        let openArchives = {}; 
        let editingPlayerId = null;

        function init() {
            const storedPlayers = localStorage.getItem(PLAYERS_KEY);
            if (storedPlayers) {
                players = JSON.parse(storedPlayers);
            } else {
                const defaultRed = ["Bayhan Gürhan", "Deniz Çatalbaş", "Mert Nobre", "Murat Arkın", "Seren Ay", "Serhan Onat", "Can Berkay", "Seda Albayrak", "Sercan Yıldırım", "Nefise Karatay", "Büşra Yalçın"];
                const defaultBlue = ["Beyza Gemici", "Engincan Tura", "Eren Semerci", "Gözde Bozkurt", "Lina Hourieh", "Nisanur Güler", "Onur Alp Çam", "Ramazan Sarı", "Sude Demir", "Osman Can", "Nagihan Karadere"];
                defaultRed.forEach(name => players.push({ id: 'r-' + Math.random().toString(36).substr(2, 9), name, team: 'red'}));
                defaultBlue.forEach(name => players.push({ id: 'b-' + Math.random().toString(36).substr(2, 9), name, team: 'blue'}));
                localStorage.setItem(PLAYERS_KEY, JSON.stringify(players));
            }
            games = JSON.parse(localStorage.getItem(GAMES_KEY)) || [];
            
            const lastDate = [...new Set(games.map(g => g.date))].sort((a,b) => b.localeCompare(a))[0];
            if(lastDate) openArchives[lastDate] = true;

            renderAll();
        }

        function renderAll() {
            renderTeam('red'); renderTeam('blue');
            renderArchive();
            renderScoreboard('daily');
            renderScoreboard('general');
        }

        function toggleArchive(date) {
            openArchives[date] = !openArchives[date];
            renderArchive();
        }

        function renderArchive() {
            const container = document.getElementById('game-archive');
            container.innerHTML = '';
            
            const grouped = {};
            games.forEach(game => { if (!grouped[game.date]) grouped[game.date] = []; grouped[game.date].push(game); });
            const sortedDates = Object.keys(grouped).sort((a, b) => b.split('.').reverse().join('-').localeCompare(a.split('.').reverse().join('-')));
            
            if (sortedDates.length === 0) {
                container.innerHTML = '<div class="text-zinc-600 text-center py-10 text-sm italic">Henüz oynanmış bir maç yok.</div>';
                return;
            }

            sortedDates.forEach(date => {
                const dayGames = grouped[date];
                let rW = 0, bW = 0;
                dayGames.forEach(g => {
                    const winnerP = players.find(x => x.id === g.winnerId);
                    if(winnerP) (winnerP.team === 'red') ? rW++ : bW++;
                });

                const isOpen = openArchives[date];
                const itemDiv = document.createElement('div');
                itemDiv.className = `archive-item border border-zinc-800 rounded-2xl overflow-hidden bg-zinc-900/20 ${isOpen ? 'active' : ''}`;
                
                itemDiv.innerHTML = `
                    <div onclick="toggleArchive('${date}')" class="archive-header flex items-center justify-between p-4 cursor-pointer hover:bg-zinc-800/50 transition-all">
                        <div class="flex items-center gap-3">
                            <i class="fas fa-chevron-down text-[10px] text-zinc-500 chevron transition-transform duration-300"></i>
                            <span class="text-xs font-black uppercase tracking-widest text-zinc-400">${date}</span>
                        </div>
                        <div class="flex items-center gap-4">
                            <div class="flex items-center gap-2 text-[11px] font-bold">
                                <span class="text-red-500">${rW}</span>
                                <span class="text-zinc-700">-</span>
                                <span class="text-blue-500">${bW}</span>
                            </div>
                            <div class="w-2 h-2 rounded-full ${rW > bW ? 'bg-red-500' : (bW > rW ? 'bg-blue-500' : 'bg-zinc-600')} shadow-[0_0_8px_currentColor]"></div>
                        </div>
                    </div>
                    <div class="archive-content" style="max-height: ${isOpen ? '2000px' : '0'}">
                        <div class="p-4 pt-0 space-y-3">
                            <div class="h-px bg-zinc-800/50 mb-4"></div>
                            ${[...dayGames].reverse().map(game => {
                                const winner = players.find(p => p.id === game.winnerId) || {name: 'Silinmiş'};
                                return `
                                    <div class="bg-zinc-800/30 border border-zinc-800/50 p-3 rounded-xl relative group">
                                        <div class="flex justify-between text-[8px] text-zinc-600 mb-2 font-bold uppercase">
                                            <span>${game.time}</span>
                                            <div class="flex gap-3">
                                                <button onclick="editGame('${game.id}')" class="text-zinc-700 hover:text-yellow-500 transition-colors">
                                                    <i class="fas fa-edit"></i>
                                                </button>
                                                <button onclick="deleteGame('${game.id}')" class="text-zinc-700 hover:text-red-500 transition-colors">
                                                    <i class="fas fa-trash-alt"></i>
                                                </button>
                                            </div>
                                        </div>
                                        <div class="flex items-center gap-3">
                                            <div class="flex-1 text-right text-xs font-bold ${game.winnerId === game.redId ? 'text-red-400' : 'text-zinc-600'}">${game.redName}</div>
                                            <div class="text-[8px] text-zinc-800 font-black italic">VS</div>
                                            <div class="flex-1 text-left text-xs font-bold ${game.winnerId === game.blueId ? 'text-blue-400' : 'text-zinc-600'}">${game.blueName}</div>
                                        </div>
                                        <div class="text-center text-[9px] font-black text-emerald-500/80 mt-2 uppercase italic">
                                            🏆 ${winner.name}
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
                container.appendChild(itemDiv);
            });
        }

        function editGame(gameId) {
            const game = games.find(g => g.id === gameId);
            if(!game) return;
            const modal = document.getElementById('edit-game-modal');
            const info = document.getElementById('edit-info');
            info.textContent = `${game.redName} vs ${game.blueName}`;
            
            document.getElementById('edit-win-red').onclick = () => updateGameResult(gameId, game.redId);
            document.getElementById('edit-win-blue').onclick = () => updateGameResult(gameId, game.blueId);
            
            modal.classList.remove('hidden');
        }

        function updateGameResult(gameId, newWinnerId) {
            const idx = games.findIndex(g => g.id === gameId);
            if(idx !== -1) {
                games[idx].winnerId = newWinnerId;
                localStorage.setItem(GAMES_KEY, JSON.stringify(games));
                document.getElementById('edit-game-modal').classList.add('hidden');
                renderAll();
            }
        }

        // --- OYUNCU DÜZENLEME (YENİ) ---
        function editPlayer(id) {
            const player = players.find(p => p.id === id);
            if(!player) return;
            
            editingPlayerId = id;
            document.getElementById('modal-title').textContent = "OYUNCU İSMİNİ DÜZELT";
            document.getElementById('player-name').value = player.name;
            
            // Butonları güncelle butonuyla değiştir
            document.getElementById('modal-buttons').innerHTML = `
                <button onclick="updatePlayerName()" class="flex-1 bg-yellow-600 py-4 rounded-2xl font-bold italic">İSMİ GÜNCELLE</button>
            `;
            
            document.getElementById('add-player-modal').classList.remove('hidden');
        }

        function updatePlayerName() {
            const newName = document.getElementById('player-name').value.trim();
            if(!newName) return;
            
            const idx = players.findIndex(p => p.id === editingPlayerId);
            if(idx !== -1) {
                players[idx].name = newName;
                
                // Geçmiş maçlardaki isimleri de güncelle (Tablo verileri için önemli)
                games.forEach(g => {
                    if(g.redId === editingPlayerId) g.redName = newName;
                    if(g.blueId === editingPlayerId) g.blueName = newName;
                });
                
                localStorage.setItem(PLAYERS_KEY, JSON.stringify(players));
                localStorage.setItem(GAMES_KEY, JSON.stringify(games));
                closeModal();
                renderAll();
            }
        }

        function renderTeam(team) {
            const topC = document.getElementById(team + '-players-top');
            const extraC = document.getElementById(team + '-extra');
            const btn = document.getElementById('btn-' + team);
            topC.innerHTML = ''; extraC.innerHTML = '';
            const teamPlayers = players.filter(p => p.team === team);
            teamPlayers.forEach((player, i) => {
                const div = document.createElement('div');
                div.className = `flex items-center justify-between bg-zinc-900/50 border border-zinc-700/30 p-3 rounded-xl`;
                div.innerHTML = `
                    <div class="font-bold text-sm truncate">${player.name}</div>
                    <div class="flex gap-3">
                        <button onclick="editPlayer('${player.id}')" class="text-zinc-600 hover:text-yellow-500 transition-colors"><i class="fas fa-edit text-xs"></i></button>
                        <button onclick="removePlayer('${player.id}')" class="text-zinc-600 hover:text-red-500 transition-colors"><i class="fas fa-times text-xs"></i></button>
                    </div>`;
                if (i < 7) topC.appendChild(div); else extraC.appendChild(div);
            });
            if (teamPlayers.length > 7) btn.classList.remove('hidden'); else btn.classList.add('hidden');
        }

        function renderScoreboard(type) {
            const topC = document.getElementById(type + '-scoreboard-top');
            const extraC = document.getElementById(type + '-extra');
            const btn = document.getElementById('btn-' + type);
            topC.innerHTML = ''; extraC.innerHTML = '';
            
            let stats = players.map(p => ({ ...p, m: 0, w: 0, l: 0 }));
            const today = new Date().toLocaleDateString('tr-TR');
            const relevantGames = (type === 'daily') ? games.filter(g => g.date === today) : games;
            
            relevantGames.forEach(g => {
                const winner = stats.find(s => s.id === g.winnerId);
                const loserId = (g.winnerId === g.redId) ? g.blueId : g.redId;
                const loser = stats.find(s => s.id === loserId);
                if(winner) { winner.m++; winner.w++; }
                if(loser) { loser.m++; loser.l++; }
            });

            const sorted = stats.filter(s => s.m > 0).sort((a, b) => b.w - a.w || b.m - a.m);
            sorted.forEach((p, i) => {
                const div = document.createElement('div');
                div.className = `flex items-center bg-zinc-900 p-3 rounded-xl border border-zinc-700/50`;
                div.innerHTML = `<div class="flex-1 flex items-center gap-2 min-w-0"><div class="${p.team === 'red' ? 'bg-red-500' : 'bg-blue-500'} w-3 h-3 rounded-full shrink-0"></div><div class="font-bold text-xs truncate">${p.name}</div></div><div class="w-7 text-center text-[11px] font-medium text-zinc-500">${p.m}</div><div class="w-7 text-center text-[11px] font-black text-emerald-400">${p.w}</div><div class="w-7 text-center text-[11px] font-medium text-red-400">${p.l}</div>`;
                if (i < 6) topC.appendChild(div); else extraC.appendChild(div);
            });
            if (sorted.length > 6) btn.classList.remove('hidden'); else btn.classList.add('hidden');
        }

        function startNewGameModal() {
            const redP = players.filter(p => p.team === 'red'); const blueP = players.filter(p => p.team === 'blue');
            if (!redP.length || !blueP.length) return alert('Her iki takımda da en az 1 oyuncu olmalı!');
            const rS = document.getElementById('red-select'); const bS = document.getElementById('blue-select');
            rS.innerHTML = ''; bS.innerHTML = '';
            redP.forEach(p => rS.innerHTML += `<option value="${p.id}">${p.name}</option>`);
            blueP.forEach(p => bS.innerHTML += `<option value="${p.id}">${p.name}</option>`);
            document.getElementById('new-game-modal').classList.remove('hidden');
        }

        function startGameFromModal() {
            const rId = document.getElementById('red-select').value; const bId = document.getElementById('blue-select').value;
            const rP = players.find(p => p.id === rId); const bP = players.find(p => p.id === bId);
            currentGame = { redId: rId, redName: rP.name, blueId: bId, blueName: bP.name, date: new Date().toLocaleDateString('tr-TR'), time: new Date().toLocaleTimeString('tr-TR', {hour: '2-digit', minute: '2-digit'}) };
            
            document.getElementById('btn-new-game').classList.add('hidden');
            document.getElementById('active-game').classList.remove('hidden');
            document.getElementById('red-fighter').innerHTML = `<div class="text-xl font-bold text-red-400 italic">${currentGame.redName}</div><div class="text-[9px] text-red-500/50 uppercase font-black mt-1">Kırmızı Takım</div>`;
            document.getElementById('blue-fighter').innerHTML = `<div class="text-xl font-bold text-blue-400 italic">${currentGame.blueName}</div><div class="text-[9px] text-blue-500/50 uppercase font-black mt-1">Mavi Takım</div>`;
            closeNewGameModal();
        }

        function cancelActiveGame() {
            if(confirm('Devam eden maçı iptal etmek istiyor musunuz?')) {
                currentGame = null;
                document.getElementById('active-game').classList.add('hidden');
                document.getElementById('btn-new-game').classList.remove('hidden');
            }
        }

        function selectWinner(winnerTeam) {
            if (!currentGame) return;
            const wId = winnerTeam === 'red' ? currentGame.redId : currentGame.blueId;
            games.push({ ...currentGame, id: Date.now().toString(), winnerId: wId });
            localStorage.setItem(GAMES_KEY, JSON.stringify(games)); 
            openArchives[currentGame.date] = true;

            document.getElementById('active-game').classList.add('win-flash');
            setTimeout(() => { 
                document.getElementById('active-game').classList.remove('win-flash'); 
                document.getElementById('active-game').classList.add('hidden');
                document.getElementById('btn-new-game').classList.remove('hidden');
                currentGame = null;
                renderAll();
            }, 600);
        }

        function deleteGame(gameId) {
            if (confirm('Bu maçı silmek istediğinize emin misiniz? Puan tabloları güncellenecektir.')) {
                games = games.filter(g => g.id !== gameId);
                localStorage.setItem(GAMES_KEY, JSON.stringify(games));
                renderAll();
            }
        }

        function toggleSection(type) {
            expanded[type] = !expanded[type];
            const extra = document.getElementById(type + '-extra');
            const btn = document.getElementById('btn-' + type);
            if (expanded[type]) {
                extra.style.maxHeight = extra.scrollHeight + "px";
                btn.textContent = "DAHA AZ";
            } else {
                extra.style.maxHeight = "0";
                btn.textContent = "DAHA FAZLA";
            }
        }

        function addPlayer(team) {
            const name = document.getElementById('player-name').value.trim();
            if (!name) return;
            players.push({ id: Date.now().toString(), name: name, team: team });
            localStorage.setItem(PLAYERS_KEY, JSON.stringify(players)); 
            renderAll(); closeModal();
            document.getElementById('player-name').value = '';
        }

        function removePlayer(id) { 
            if (confirm('Oyuncuyu silmek tüm geçmiş maç verilerini bozmaz ama listeden kaldırır. Emin misiniz?')) {
                players = players.filter(p => p.id !== id); 
                localStorage.setItem(PLAYERS_KEY, JSON.stringify(players)); 
                renderAll(); 
            }
        }

        function resetAll() { if (confirm('TÜM VERİLER (Oyuncular dahil) silinecektir. Emin misiniz?')) { localStorage.clear(); players = []; games = []; init(); } }
        
        function closeModal() { 
            document.getElementById('add-player-modal').classList.add('hidden'); 
            editingPlayerId = null;
            // Modal butonlarını ve başlığını eski haline getir (Ekleme modu)
            document.getElementById('modal-title').textContent = "YENİ OYUNCU EKLE";
            document.getElementById('modal-buttons').innerHTML = `
                <button onclick="addPlayer('red')" class="flex-1 bg-red-600 py-4 rounded-2xl font-bold italic">KIRMIZIYA EKLE</button>
                <button onclick="addPlayer('blue')" class="flex-1 bg-blue-600 py-4 rounded-2xl font-bold italic">MAVİYE EKLE</button>
            `;
            document.getElementById('player-name').value = '';
        }

        function addPlayerModal() { document.getElementById('add-player-modal').classList.remove('hidden'); document.getElementById('player-name').focus(); }
        function closeNewGameModal() { document.getElementById('new-game-modal').classList.add('hidden'); }

        init();
    </script>
</body>
</html>
